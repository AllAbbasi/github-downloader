name: Download File from Any Link

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'URL to download from'
        required: true
        type: string
      filename:
        description: 'Save as (optional)'
        required: false
        type: string
      folder_path:
        description: 'Folder path (optional)'
        required: false
        type: string
        default: 'downloads'

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download and commit file
        run: |
          # Set up git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Determine filename
          if [ -n "${{ inputs.filename }}" ]; then
            FILENAME="${{ inputs.filename }}"
          else
            FILENAME=$(basename "${{ inputs.file_url }}" | cut -d '?' -f1)
            if [ -z "$FILENAME" ]; then
              FILENAME="downloaded_file"
            fi
          fi
          
          # Determine path
          if [ -n "${{ inputs.folder_path }}" ]; then
            mkdir -p "${{ inputs.folder_path }}"
            FILE_PATH="${{ inputs.folder_path }}/$FILENAME"
          else
            FILE_PATH="$FILENAME"
          fi
          
          # Download
          echo "Downloading from: ${{ inputs.file_url }}"
          curl -L "${{ inputs.file_url }}" --output "$FILE_PATH"
          
          # Check if download succeeded
          if [ ! -f "$FILE_PATH" ]; then
            echo "Error: Download failed"
            exit 1
          fi
          
          # Add and commit
          git add "$FILE_PATH"
          git commit -m "Add file from ${{ inputs.file_url }}" || echo "No changes to commit"
          
          # Push with token
          git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git
          
          echo "✅ Successfully added: $FILE_PATH"
