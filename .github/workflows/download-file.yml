name: Download File from Any Link

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'Direct URL of the file to download'
        required: true
        type: string
      filename:
        description: 'Name to save the file as (optional)'
        required: false
        type: string
      folder_path:
        description: 'Folder path (optional)'
        required: false
        type: string
        default: 'downloads'

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:               # ← KEY FIX: permissions inside the job
      contents: write
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download file
        id: download
        run: |
          # Determine filename
          if [ -n "${{ inputs.filename }}" ]; then
            FILENAME="${{ inputs.filename }}"
          else
            FILENAME=$(basename "${{ inputs.file_url }}" | cut -d '?' -f1)
            [ -z "$FILENAME" ] && FILENAME="downloaded_file"
          fi
          
          # Create folder if needed
          mkdir -p "${{ inputs.folder_path }}"
          FILE_PATH="${{ inputs.folder_path }}/$FILENAME"
          
          # Download with browser user-agent (helps avoid blocks)
          curl -L --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -o "$FILE_PATH" "${{ inputs.file_url }}"
          
          echo "file_path=$FILE_PATH" >> $GITHUB_OUTPUT
          echo "Downloaded to: $FILE_PATH"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.download.outputs.file_path }}"
          git commit -m "Add file from ${{ inputs.file_url }}" || echo "No changes"
          git push   # Simple push - uses GITHUB_TOKEN with write permissions
