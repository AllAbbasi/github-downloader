name: Download File from Any Link (PAT version)

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'Direct URL of the file to download'
        required: true
        type: string
      filename:
        description: 'Name to save the file as (optional)'
        required: false
        type: string
      folder_path:
        description: 'Folder path (optional)'
        required: false
        type: string
        default: 'downloads'

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with PAT
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Download file
        id: download
        run: |
          FILENAME="${{ inputs.filename }}"
          if [ -z "$FILENAME" ]; then
            FILENAME=$(basename "${{ inputs.file_url }}" | cut -d '?' -f1)
            [ -z "$FILENAME" ] && FILENAME="downloaded_file"
          fi
          
          mkdir -p "${{ inputs.folder_path }}"
          FILE_PATH="${{ inputs.folder_path }}/$FILENAME"
          
          curl -L -o "$FILE_PATH" "${{ inputs.file_url }}"
          
          echo "file_path=$FILE_PATH" >> $GITHUB_OUTPUT
          echo "Downloaded to: $FILE_PATH"

      - name: Commit and push (auto LFS for large files)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          FILE_PATH="${{ steps.download.outputs.file_path }}"
          FILE_SIZE=$(stat -c%s "$FILE_PATH" 2>/dev/null || stat -f%z "$FILE_PATH" 2>/dev/null)
          SIZE_MB=$((FILE_SIZE / 1048576))
          LIMIT=104857600  # 100 MB in bytes
          
          echo "File size: ${SIZE_MB} MB"
          
          if [ $FILE_SIZE -gt $LIMIT ]; then
            echo "⚠️ File exceeds 100 MB. Using Git LFS..."
            
            # Install Git LFS (already on runner, but ensure)
            git lfs install
            
            # Track the file pattern (use relative path)
            REL_PATH="${FILE_PATH#./}"
            git lfs track "$REL_PATH"
            
            # Add .gitattributes if new
            git add .gitattributes
            git commit -m "Track large file with Git LFS" || echo "LFS tracking already committed"
            
            # Add and commit the large file (will be stored as LFS pointer)
            git add "$REL_PATH"
            git commit -m "Add large file from ${{ inputs.file_url }} (${SIZE_MB} MB, using LFS)"
          else
            echo "File under 100 MB. Committing normally."
            git add "$FILE_PATH"
            git commit -m "Add file from ${{ inputs.file_url }}" || echo "No changes to commit"
          fi
          
          # Push (the checkout already set up authentication with PAT)
          git push
          echo "✅ Successfully pushed file(s)."
