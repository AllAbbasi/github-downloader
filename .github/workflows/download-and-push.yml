name: Download File and Push to Repository

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: 'The URL of the file to download'
        required: true
        type: string
      destination_path:
        description: 'Destination path (including filename) to save the file in the repository (e.g. downloads/myfile.zip)'
        required: false
        default: 'downloads/'
        type: string
      commit_message:
        description: 'Commit message'
        required: false
        default: 'chore: add downloaded file'
        type: string

jobs:
  download-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          URL="${{ inputs.download_url }}"

          # Only allow https:// URLs to prevent SSRF via other protocols
          if [[ "$URL" != https://* ]]; then
            echo "Error: download_url must start with https://"
            exit 1
          fi

      - name: Resolve destination path
        id: resolve_path
        run: |
          DEST="${{ inputs.destination_path }}"
          URL="${{ inputs.download_url }}"

          # If destination ends with '/', append the filename derived from the URL
          if [[ "$DEST" == */ ]]; then
            # Strip query string / fragment, then take the last path component
            FILENAME=$(basename "$(echo "$URL" | sed 's/[?#].*$//')")
            if [[ -z "$FILENAME" ]]; then
              echo "Error: could not determine a filename from the URL. Please provide a full destination path."
              exit 1
            fi
            DEST="${DEST}${FILENAME}"
          fi

          # Resolve the absolute destination path and verify it stays inside the workspace
          WORKSPACE="$(realpath "$GITHUB_WORKSPACE")"
          ABS_DEST="$(realpath -m "${WORKSPACE}/${DEST}")"
          if [[ "$ABS_DEST" != "${WORKSPACE}"/* ]]; then
            echo "Error: destination path must be inside the repository workspace."
            exit 1
          fi

          # Store the path relative to the workspace so git commands are portable
          REL_DEST="${ABS_DEST#${WORKSPACE}/}"
          echo "dest_path=${REL_DEST}" >> "$GITHUB_OUTPUT"

      - name: Create destination directory
        run: mkdir -p "$(dirname "${{ steps.resolve_path.outputs.dest_path }}")"

      - name: Download file
        run: |
          curl -fsSL \
            --max-time 300 `# Allow up to 5 minutes for large file downloads` \
            --retry 3 \
            --retry-delay 5 \
            -o "${{ steps.resolve_path.outputs.dest_path }}" \
            "${{ inputs.download_url }}"
          echo "Downloaded to: ${{ steps.resolve_path.outputs.dest_path }}"

      - name: Commit and push file
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.resolve_path.outputs.dest_path }}"
          if git diff --cached --quiet; then
            echo "No changes to commit — file is identical to what is already in the repository."
          else
            git commit -m "${{ inputs.commit_message }}"
            git push
          fi
